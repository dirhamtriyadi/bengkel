name: bengkel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bengkel
      POSTGRES_USER: bengkel
      POSTGRES_PASSWORD: bengkel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bengkel -d bengkel"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    entrypoint: ["/app/seed"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
        NEXT_PUBLIC_MIDTRANS_SNAP_URL: ${NEXT_PUBLIC_MIDTRANS_SNAP_URL:-https://app.sandbox.midtrans.com/snap/snap.js}
    environment:
      API_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
