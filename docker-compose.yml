name: bengkel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bengkel
      POSTGRES_USER: bengkel
      POSTGRES_PASSWORD: bengkel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bengkel -d bengkel"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port di sisi kiri boleh diubah. PostgreSQL antarkontainer tetap postgres:5432.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    entrypoint: ["/app/seed"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Port proses di dalam container sengaja dikunci. Ubah API_HOST_PORT untuk port publik.
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://bengkel:bengkel@postgres:5432/bengkel?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      API_ORIGIN: http://api:8080
      # Next.js selalu mendengarkan port internal 3000.
      PORT: "3000"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
