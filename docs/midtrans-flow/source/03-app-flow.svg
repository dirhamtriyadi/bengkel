          <rect x="955" y="4" width="82" height="34" rx="12" fill="#fff" stroke="#d6d3d1"/><text x="996" y="26" text-anchor="middle" font-size="13" font-weight="700">Masuk staf</text>
          <text x="0" y="105" font-size="14" font-weight="800" fill="#f97316">SERVIS MOTOR TANPA DRAMA</text>
          <text x="0" y="155" font-size="37" font-weight="900" fill="#171717">Motor sehat, perjalanan tenang.</text>
          <text x="0" y="192" font-size="16" fill="#78716c">Perawatan transparan, suku cadang terjamin, dan riwayat servis tercatat.</text>
