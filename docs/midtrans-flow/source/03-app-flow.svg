    <text x="82" y="174" font-size="49" font-weight="900" fill="#171717">Dari website hingga tombol checkout</text>
    <text x="82" y="218" font-size="21" fill="#57534e">Representasi layar aktual BengkelOS sebelum pelanggan diarahkan ke Snap.</text>

    <g transform="translate(82 282)">
