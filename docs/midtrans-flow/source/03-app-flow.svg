      <text x="76" y="25" font-size="22" font-weight="900" fill="#171717">Pelanggan membuka website Bengkel Maju Motor</text>
      <text x="76" y="53" font-size="16" fill="#78716c">Melihat layanan, transparansi harga, cara kerja, lalu datang atau membuat janji servis.</text>
      <g transform="translate(0 83)" filter="url(#shadow)">
        <rect width="1076" height="330" rx="26" fill="#fff"/>
