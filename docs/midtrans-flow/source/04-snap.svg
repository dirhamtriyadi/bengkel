<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#292524"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/></marker>
  </defs>
  <rect width="1240" height="1754" fill="#faf9f7"/>
  <rect width="1240" height="18" fill="#f97316"/>
  <g font-family="Noto Sans,DejaVu Sans,sans-serif">
    <text x="82" y="105" font-size="18" font-weight="800" fill="#f97316" letter-spacing="2">MIDTRANS SNAP PAYMENT PAGE</text>
    <text x="82" y="174" font-size="49" font-weight="900" fill="#171717">Pelanggan masuk ke halaman pembayaran</text>
    <text x="82" y="218" font-size="21" fill="#57534e">Snap tampil sebagai popup aman di atas aplikasi setelah tombol “Bayar &amp; cetak” diklik.</text>

    <g transform="translate(82 278)" filter="url(#shadow)">
      <rect width="1076" height="820" rx="30" fill="url(#bg)"/>
      <rect x="34" y="34" width="1008" height="752" rx="24" fill="#0c0a09"/>
      <g opacity=".22">
        <rect x="72" y="78" width="170" height="20" rx="10" fill="#fff"/><rect x="72" y="125" width="310" height="48" rx="12" fill="#fff"/><rect x="72" y="204" width="585" height="455" rx="18" fill="#fff"/><rect x="685" y="204" width="315" height="455" rx="18" fill="#fff"/>
      </g>
      <rect x="337" y="75" width="405" height="670" rx="22" fill="#fff"/>
      <rect x="337" y="75" width="405" height="92" rx="22" fill="#f97316"/><rect x="337" y="142" width="405" height="25" fill="#f97316"/>
      <text x="367" y="113" font-size="13" font-weight="700" fill="#ffedd5">BENGKEL MAJU MOTOR</text>
      <text x="367" y="143" font-size="27" font-weight="900" fill="#fff">Rp246.715</text>
      <circle cx="704" cy="108" r="13" fill="#fff" opacity=".24"/><path d="M699 103 l10 10 M709 103 l-10 10" stroke="#fff" stroke-width="2.5"/>

      <text x="367" y="208" font-size="13" fill="#78716c">Order ID</text><text x="704" y="208" text-anchor="end" font-size="13" font-weight="800" fill="#171717">INV-20260726-8E3BFF</text>
      <text x="367" y="248" font-size="20" font-weight="900" fill="#171717">Pilih metode pembayaran</text>

      <g transform="translate(365 278)">
        <rect width="349" height="72" rx="13" fill="#fff" stroke="#e7e5e4"/><circle cx="34" cy="36" r="20" fill="#eff6ff"/><path d="M23 39 h22 M25 32 h18 M28 26 h12" stroke="#2563eb" stroke-width="3"/><text x="70" y="32" font-size="15" font-weight="800">Transfer bank / Virtual Account</text><text x="70" y="53" font-size="12" fill="#78716c">BCA, BNI, BRI, Mandiri, Permata</text><path d="M323 31 l7 7 7-7" fill="none" stroke="#a8a29e" stroke-width="2"/>
        <rect y="86" width="349" height="72" rx="13" fill="#fff" stroke="#e7e5e4"/><circle cx="34" cy="122" r="20" fill="#ecfdf5"/><rect x="24" y="112" width="20" height="20" fill="none" stroke="#059669" stroke-width="3"/><path d="M27 115 h5 v5 h-5 M36 115 h5 v5 h-5 M27 124 h5 v5 h-5 M36 124 h5 v5 h-5" fill="#059669"/><text x="70" y="118" font-size="15" font-weight="800">QRIS</text><text x="70" y="139" font-size="12" fill="#78716c">Scan dari aplikasi pembayaran</text><path d="M323 117 l7 7 7-7" fill="none" stroke="#a8a29e" stroke-width="2"/>
        <rect y="172" width="349" height="72" rx="13" fill="#fff" stroke="#e7e5e4"/><circle cx="34" cy="208" r="20" fill="#ecfeff"/><text x="34" y="214" text-anchor="middle" font-size="13" font-weight="900" fill="#0891b2">G</text><text x="70" y="204" font-size="15" font-weight="800">GoPay dan e-wallet</text><text x="70" y="225" font-size="12" fill="#78716c">Bayar dari aplikasi terkait</text><path d="M323 203 l7 7 7-7" fill="none" stroke="#a8a29e" stroke-width="2"/>
        <rect y="258" width="349" height="72" rx="13" fill="#fff" stroke="#e7e5e4"/><circle cx="34" cy="294" r="20" fill="#fef2f2"/><rect x="22" y="286" width="24" height="16" rx="3" fill="none" stroke="#dc2626" stroke-width="2.5"/><line x1="22" y1="291" x2="46" y2="291" stroke="#dc2626" stroke-width="2.5"/><text x="70" y="290" font-size="15" font-weight="800">Kartu kredit / debit</text><text x="70" y="311" font-size="12" fill="#78716c">Pembayaran aman dengan 3DS</text><path d="M323 289 l7 7 7-7" fill="none" stroke="#a8a29e" stroke-width="2"/>
      </g>
      <text x="539" y="690" text-anchor="middle" font-size="12" fill="#a8a29e">Secure payment powered by Midtrans</text>
    </g>

    <g transform="translate(82 1160)">
      <text x="0" y="0" font-size="18" font-weight="800" fill="#78716c" letter-spacing="1.5">LANGKAH PELANGGAN DI SNAP</text>
      <g transform="translate(0 40)">
        <circle cx="42" cy="42" r="42" fill="#f97316"/><text x="42" y="51" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">1</text>
        <text x="0" y="112" font-size="17" font-weight="900">Pilih kanal</text><text x="0" y="140" font-size="14" fill="#78716c">VA, QRIS, e-wallet,</text><text x="0" y="162" font-size="14" fill="#78716c">atau kartu</text>
        <line x1="165" y1="42" x2="247" y2="42" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>
        <g transform="translate(270 0)"><circle cx="42" cy="42" r="42" fill="#f97316"/><text x="42" y="51" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">2</text><text x="0" y="112" font-size="17" font-weight="900">Ikuti instruksi</text><text x="0" y="140" font-size="14" fill="#78716c">Transfer, scan QR,</text><text x="0" y="162" font-size="14" fill="#78716c">atau autentikasi 3DS</text></g>
        <line x1="435" y1="42" x2="517" y2="42" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>
        <g transform="translate(540 0)"><circle cx="42" cy="42" r="42" fill="#f97316"/><text x="42" y="51" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">3</text><text x="0" y="112" font-size="17" font-weight="900">Midtrans memproses</text><text x="0" y="140" font-size="14" fill="#78716c">Status pending, sukses,</text><text x="0" y="162" font-size="14" fill="#78716c">atau gagal</text></g>
        <line x1="735" y1="42" x2="817" y2="42" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>
        <g transform="translate(840 0)"><circle cx="42" cy="42" r="42" fill="#22c55e"/><path d="M25 42 l12 12 23-28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="0" y="112" font-size="17" font-weight="900">Kembali ke invoice</text><text x="0" y="140" font-size="14" fill="#78716c">Status tersinkron dan</text><text x="0" y="162" font-size="14" fill="#78716c">bukti dapat dicetak</text></g>
      </g>
    </g>

    <g transform="translate(82 1483)">
      <rect width="1076" height="138" rx="24" fill="#fff1e8"/>
      <circle cx="55" cy="69" r="27" fill="#f97316"/><path d="M55 52 v21 M55 84 v2" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="101" y="55" font-size="17" font-weight="900" fill="#9a3412">Batas tanggung jawab antarmuka</text>
      <text x="101" y="85" font-size="15" fill="#9a3412">BengkelOS menampilkan invoice dan memanggil token Snap. Input rekening, kartu, OTP,</text>
      <text x="101" y="109" font-size="15" fill="#9a3412">serta autentikasi pembayaran dilakukan langsung pada halaman aman Midtrans.</text>
    </g>
  </g>
  <text x="82" y="1692" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="15" fill="#a8a29e">BengkelOS · Flow Transaksi Midtrans</text>
  <text x="1158" y="1692" text-anchor="end" font-family="Noto Sans,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#78716c">04 / 05</text>
</svg>
