basePath: /api/v1
definitions:
  bengkel_internal_http_response.APIError:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/bengkel_internal_http_response.FieldError'
        type: array
      message:
        type: string
    type: object
  bengkel_internal_http_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/bengkel_internal_http_response.APIError'
      meta:
        $ref: '#/definitions/bengkel_internal_http_response.Meta'
    type: object
  bengkel_internal_http_response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      rule:
        type: string
    type: object
  bengkel_internal_http_response.Meta:
    properties:
      last_page:
        type: integer
      page:
        type: integer
      per_page:
        type: integer
      request_id:
        type: string
      total:
        type: integer
    type: object
  internal_http_handler.accountInput:
    properties:
      code:
        maxLength: 30
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      parent_id:
        type: string
      type:
        enum:
        - asset
        - liability
        - equity
        - revenue
        - expense
        type: string
    required:
    - code
    - is_active
    - name
    - type
    type: object
  internal_http_handler.branchInput:
    properties:
      address:
        type: string
      code:
        maxLength: 30
        type: string
      currency:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      phone:
        maxLength: 30
        type: string
      timezone:
        maxLength: 60
        type: string
    required:
    - code
    - currency
    - is_active
    - name
    - timezone
    type: object
  internal_http_handler.checkoutInput:
    properties:
      amount_paid:
        minimum: 0
        type: integer
      customer_id:
        type: string
      discount:
        minimum: 0
        type: integer
      fee_bearer:
        enum:
        - merchant
        - customer
        - split
        type: string
      items:
        items:
          $ref: '#/definitions/internal_http_handler.workItemInput'
        type: array
      notes:
        type: string
      payment_method:
        enum:
        - cash
        - midtrans
        type: string
      tax:
        minimum: 0
        type: integer
      work_order_id:
        type: string
    required:
    - payment_method
    type: object
  internal_http_handler.customerInput:
    properties:
      address:
        type: string
      code:
        maxLength: 50
        type: string
      email:
        type: string
      name:
        maxLength: 150
        type: string
      notes:
        type: string
      phone:
        maxLength: 30
        type: string
    required:
    - code
    - name
    type: object
  internal_http_handler.intakeCustomerInput:
    properties:
      address:
        type: string
      email:
        type: string
      name:
        maxLength: 150
        type: string
      phone:
        maxLength: 30
        type: string
    required:
    - name
    type: object
  internal_http_handler.intakeInput:
    properties:
      complaint:
        maxLength: 1000
        type: string
      customer:
        $ref: '#/definitions/internal_http_handler.intakeCustomerInput'
      customer_id:
        type: string
      mechanic_id:
        type: string
      odometer:
        minimum: 0
        type: integer
      vehicle:
        $ref: '#/definitions/internal_http_handler.intakeVehicleInput'
      vehicle_id:
        type: string
    required:
    - complaint
    type: object
  internal_http_handler.intakeVehicleInput:
    properties:
      brand:
        maxLength: 80
        type: string
      color:
        maxLength: 50
        type: string
      identifier:
        maxLength: 100
        type: string
      model:
        maxLength: 100
        type: string
      plate_number:
        maxLength: 30
        type: string
      year:
        minimum: 0
        type: integer
    required:
    - identifier
    type: object
  internal_http_handler.journalInput:
    properties:
      description:
        maxLength: 500
        type: string
      entry_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/internal_http_handler.journalLineInput'
        minItems: 2
        type: array
    required:
    - description
    - entry_date
    - lines
    type: object
  internal_http_handler.journalLineInput:
    properties:
      account_id:
        type: string
      credit:
        minimum: 0
        type: integer
      debit:
        minimum: 0
        type: integer
      description:
        type: string
    required:
    - account_id
    type: object
  internal_http_handler.loginInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_http_handler.productInput:
    properties:
      cost_price:
        minimum: 0
        type: integer
      is_active:
        type: boolean
      min_stock:
        minimum: 0
        type: number
      name:
        maxLength: 180
        type: string
      selling_price:
        minimum: 0
        type: integer
      sku:
        maxLength: 80
        type: string
      type:
        enum:
        - part
        - service
        - other
        type: string
      unit:
        maxLength: 30
        type: string
    required:
    - name
    - sku
    - type
    - unit
    type: object
  internal_http_handler.refreshInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_http_handler.roleInput:
    properties:
      code:
        maxLength: 60
        type: string
      description:
        type: string
      name:
        maxLength: 100
        type: string
      permission_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - code
    - name
    - permission_ids
    type: object
  internal_http_handler.stockInput:
    properties:
      direction:
        enum:
        - in
        - out
        - adjustment
        type: string
      notes:
        maxLength: 500
        type: string
      product_id:
        type: string
      quantity:
        type: number
      unit_cost:
        minimum: 0
        type: integer
    required:
    - direction
    - product_id
    - quantity
    type: object
  internal_http_handler.userInput:
    properties:
      branch_id:
        type: string
      email:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      password:
        minLength: 8
        type: string
      phone:
        maxLength: 30
        type: string
      role_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - email
    - is_active
    - name
    - password
    - role_ids
    type: object
  internal_http_handler.userUpdateInput:
    properties:
      branch_id:
        type: string
      email:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      password:
        minLength: 8
        type: string
      phone:
        maxLength: 30
        type: string
      role_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - email
    - is_active
    - name
    - role_ids
    type: object
  internal_http_handler.vehicleInput:
    properties:
      brand:
        maxLength: 80
        type: string
      color:
        type: string
      customer_id:
        type: string
      identifier:
        maxLength: 100
        type: string
      model:
        maxLength: 100
        type: string
      notes:
        type: string
      odometer:
        minimum: 0
        type: integer
      plate_number:
        maxLength: 30
        type: string
      year:
        minimum: 0
        type: integer
    required:
    - identifier
    type: object
  internal_http_handler.workItemInput:
    properties:
      discount:
        minimum: 0
        type: integer
      product_id:
        type: string
      quantity:
        type: number
    required:
    - product_id
    - quantity
    type: object
  internal_http_handler.workOrderInput:
    properties:
      complaint:
        type: string
      customer_id:
        type: string
      mechanic_id:
        type: string
      odometer:
        minimum: 0
        type: integer
      vehicle_id:
        type: string
    required:
    - complaint
    - customer_id
    - vehicle_id
    type: object
  internal_http_handler.workOrderUpdateInput:
    properties:
      diagnosis:
        maxLength: 3000
        type: string
      mechanic_id:
        type: string
      status:
        enum:
        - inspection
        - approval
        - in_progress
        - completed
        - cancelled
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  description: API operasional bengkel, kasir, stok, pembayaran, akuntansi, audit,
    dan CMS.
  title: BengkelOS API
  version: "1.0"
paths:
  /accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar chart of accounts
      tags:
      - Accounting
    post:
      consumes:
      - application/json
      parameters:
      - description: Akun
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.accountInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Tambah akun COA
      tags:
      - Accounting
  /accounts/{id}:
    delete:
      parameters:
      - description: ID akun
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Hapus akun yang belum digunakan
      tags:
      - Accounting
    put:
      consumes:
      - application/json
      parameters:
      - description: ID akun
        in: path
        name: id
        required: true
        type: string
      - description: Akun
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.accountInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Ubah akun COA
      tags:
      - Accounting
  /audit-logs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar audit log immutable
      tags:
      - Audit
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.loginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      summary: Login pengguna
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.refreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Cabut refresh token
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Profil pengguna aktif
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.refreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      summary: Rotasi access dan refresh token
      tags:
      - Auth
  /branches:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar cabang
      tags:
      - Branches
    post:
      consumes:
      - application/json
      parameters:
      - description: Cabang
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.branchInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Tambah cabang
      tags:
      - Branches
  /branches/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID cabang
        in: path
        name: id
        required: true
        type: string
      - description: Cabang
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.branchInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Ubah cabang
      tags:
      - Branches
  /cms/pages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar halaman CMS
      tags:
      - CMS
  /customers:
    get:
      parameters:
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman
        in: query
        name: per_page
        type: integer
      - description: Pencarian
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar pelanggan
      tags:
      - Customers
    post:
      consumes:
      - application/json
      parameters:
      - description: Pelanggan
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.customerInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Tambah pelanggan
      tags:
      - Customers
  /customers/{id}:
    delete:
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Hapus pelanggan
      tags:
      - Customers
    put:
      consumes:
      - application/json
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      - description: Pelanggan
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.customerInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Ubah pelanggan
      tags:
      - Customers
  /dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Statistik dashboard cabang
      tags:
      - Dashboard
  /inventory:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Saldo persediaan cabang
      tags:
      - Inventory
  /inventory/adjustments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Pergerakan stok
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.stockInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Penyesuaian stok dengan row lock
      tags:
      - Inventory
  /inventory/movements:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Riwayat pergerakan persediaan
      tags:
      - Inventory
  /journals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar journal entry
      tags:
      - Accounting
    post:
      consumes:
      - application/json
      parameters:
      - description: Journal entry
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.journalInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Buat jurnal manual sebagai draft
      tags:
      - Accounting
  /journals/{id}:
    delete:
      parameters:
      - description: ID jurnal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Hapus jurnal draft
      tags:
      - Accounting
    get:
      parameters:
      - description: ID jurnal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Detail journal entry dan baris
      tags:
      - Accounting
    put:
      consumes:
      - application/json
      parameters:
      - description: ID jurnal
        in: path
        name: id
        required: true
        type: string
      - description: Journal entry
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_http_handler.journalInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Ubah jurnal draft
      tags:
      - Accounting
  /journals/{id}/post:
    post:
      parameters:
      - description: ID jurnal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Posting jurnal secara immutable
      tags:
      - Accounting
  /journals/{id}/reverse:
    post:
      parameters:
      - description: ID jurnal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Buat jurnal pembalik
      tags:
      - Accounting
  /payments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar pembayaran
      tags:
      - Payments
  /payments/{id}:
    get:
      parameters:
      - description: ID pembayaran
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Detail pembayaran
      tags:
      - Payments
  /payments/{id}/midtrans/snap:
    post:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Buat atau ambil ulang token pembayaran Midtrans Snap
      tags:
      - Payments
  /payments/{id}/midtrans/sync:
    post:
      description: Berguna setelah callback Snap dan saat notification URL tidak dapat
        menjangkau localhost.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bengkel_internal_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Sinkronkan status pembayaran langsung ke Midtrans
      tags:
      - Payments
  /permissions:
    get:
